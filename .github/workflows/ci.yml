name: CI

on:
  push:
    branches: ['**']  # Trigger on all branches
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.arch }}
    runs-on: ubuntu-latest
    # ARM emulation via QEMU is significantly slower than native x86
    # Allow up to 60 minutes to ensure tests complete on both architectures
    timeout-minutes: 60
    strategy:
      # Stop early if one platform fails to save CI minutes and provide faster feedback
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download and cache the test images dataset for ground-truth verification
      # The dataset is ~100MB and contains tiles needed for integration tests
      - name: Cache test images dataset
        id: cache-tiles
        uses: actions/cache@v4
        with:
          path: moseiik_test_images
          key: moseiik-test-images-v1

      - name: Download test images dataset
        if: steps.cache-tiles.outputs.cache-hit != 'true'
        run: |
          wget -q https://nasext-vaader.insa-rennes.fr/ietr-vaader/moseiik_test_images.zip
          unzip -q moseiik_test_images.zip
          rm moseiik_test_images.zip

      # QEMU is only needed for ARM builds on x86 runners
      # It provides CPU emulation allowing ARM binaries to run on x86 hardware
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # Buildx enables multi-platform Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image for the target platform
      # Uses GitHub Actions cache to speed up subsequent builds
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: moseiik:test-${{ matrix.arch }}
          # Export to Docker daemon for local testing
          # Note: This works with QEMU for cross-platform builds
          load: true
          # GitHub Actions cache dramatically improves build times
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Run all tests including the ground-truth verification test
      # The '--' separator in ENTRYPOINT allows passing test filters
      # We use '--include-ignored' to run the ground-truth test that's normally ignored
      - name: Run tests (unit + integration)
        run: docker run --rm --platform ${{ matrix.platform }} -v $PWD/moseiik_test_images:/app/moseiik_test_images moseiik:test-${{ matrix.arch }}

      - name: Run ground-truth verification test
        run: docker run --rm --platform ${{ matrix.platform }} -v $PWD/moseiik_test_images:/app/moseiik_test_images moseiik:test-${{ matrix.arch }} --ignored test_ground_truth_kit
