name: CI

on:
  push:
    branches: ['**']  # Trigger on all branches
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.arch }}
    runs-on: ubuntu-latest
    # ARM emulation via QEMU is significantly slower than native x86
    # Allow up to 60 minutes to ensure tests complete on both architectures
    timeout-minutes: 60
    strategy:
      # Stop early if one platform fails to save CI minutes and provide faster feedback
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download and cache the test images dataset for ground-truth verification
      # The dataset is ~100MB and contains tiles needed for integration tests
      - name: Cache test images dataset
        id: cache-tiles
        uses: actions/cache@v4
        with:
          path: moseiik_test_images
          key: moseiik-test-images-v1

      - name: Download test images dataset
        if: steps.cache-tiles.outputs.cache-hit != 'true'
        run: |
          wget -q https://nasext-vaader.insa-rennes.fr/ietr-vaader/moseiik_test_images.zip
          unzip -q moseiik_test_images.zip -d moseiik_test_images
          rm moseiik_test_images.zip
          # The zip should contain: kit.jpeg, output.jpeg, and images/ directory
          echo "Extracted files:"
          ls -la moseiik_test_images/
          echo "Sample of tiles:"
          ls moseiik_test_images/images/ | head -10

      # QEMU is only needed for ARM builds on x86 runners
      # It provides CPU emulation allowing ARM binaries to run on x86 hardware
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # Buildx enables multi-platform Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image for the target platform
      # Uses GitHub Actions cache to speed up subsequent builds
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: moseiik:test-${{ matrix.arch }}
          # Export to Docker daemon for local testing
          # Note: This works with QEMU for cross-platform builds
          load: true
          # Cache strategy: GitHub Actions cache service (type=gha)
          # Uses GHA cache for build layers, scoped per architecture. May be subject to 502 errors.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}

      # Verify test dataset was downloaded correctly
      - name: Verify test dataset
        run: |
          echo "Checking moseiik_test_images directory..."
          ls -la moseiik_test_images/
          echo "Sample of tiles:"
          ls moseiik_test_images/images/ | head -10
          echo "Total tile count:"
          ls -1 moseiik_test_images/images/ | wc -l

      # Run all integration tests (generic, x86/SSE2/AVX2, or ARM/NEON depending on platform)
      # All tests use the moseiik_test_images dataset and verify against output.jpeg
      - name: Run integration tests
        run: docker run --rm --platform ${{ matrix.platform }} -v "${{ github.workspace }}/moseiik_test_images:/app/moseiik_test_images" moseiik:test-${{ matrix.arch }}
